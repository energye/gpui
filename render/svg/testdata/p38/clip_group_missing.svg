<svg xmlns="http://www.w3.org/2000/svg" width="100" height="80" viewBox="0 0 100 80">
  <!-- clip on <g> (children clipped together) + missing clip ref (refused) -->
  <defs>
    <clipPath id="top-half" clipPathUnits="userSpaceOnUse">
      <rect x="0" y="0" width="100" height="40"/>
    </clipPath>
  </defs>
  <g clip-path="url(#top-half)">
    <rect x="0" y="0" width="100" height="80" fill="#c05df0"/>
  </g>
  <rect x="10" y="60" width="40" height="10" fill="url(#no-such-clip)" clip-path="url(#no-such-clip)"/>
  <rect x="60" y="60" width="30" height="10" fill="#00ff00"/>
</svg>
