<svg xmlns="http://www.w3.org/2000/svg" width="200" height="60" viewBox="0 0 200 60">
  <!-- objectBoundingBox (default units) + repeat: 4 ramp cycles across 4 squares -->
  <defs>
    <linearGradient id="rep" spreadMethod="repeat">
      <stop offset="0" stop-color="#ff0000"/>
      <stop offset="1" stop-color="#0000ff"/>
    </linearGradient>
  </defs>
  <rect x="0"   y="0" width="40" height="60" fill="url(#rep)"/>
  <rect x="60"  y="0" width="40" height="60" fill="url(#rep)"/>
  <rect x="120" y="0" width="40" height="60" fill="url(#rep)"/>
  <rect x="180" y="0" width="20" height="60" fill="url(#rep)"/>
</svg>
