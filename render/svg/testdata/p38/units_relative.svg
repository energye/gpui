<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" width="200" height="100">
  <!-- font-relative and percent units; font-size inherited then overridden -->
  <g font-size="20">
    <rect x="1em" y="1ex" width="2em" height="0.5ex" fill="#0088ff"/>
  </g>
  <g font-size="10">
    <rect x="5%" y="10%" width="25%" height="50%" fill="#ff8800"/>
    <circle cx="50%" cy="50%" r="10%" fill="#00aa00"/>
  </g>
</svg>
