<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- inheritance tree: fill/fill-opacity/stroke-width/stroke-dasharray inherit through g;
       style attribute overrides presentation attribute; currentColor resolves via color -->
  <g fill="#ff0000" fill-opacity="0.5" stroke="#0000ff" stroke-width="4" stroke-dasharray="6 2" stroke-miterlimit="4" color="#00ff00">
    <g stroke-width="2">
      <!-- inherits fill, fill-opacity, stroke, dasharray, miterlimit, color; stroke-width overridden -->
      <rect x="5" y="5" width="20" height="20" fill-opacity="0.8"/>
      <!-- currentColor: fill resolves to inherited color #00ff00 -->
      <rect x="30" y="5" width="20" height="20" fill="currentColor"/>
      <!-- style attribute overrides presentation attribute -->
      <rect x="55" y="5" width="20" height="20" fill="#000000" style="fill:#ffff00"/>
    </g>
  </g>
</svg>
