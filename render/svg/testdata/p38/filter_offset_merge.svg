<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80" viewBox="0 0 120 80">
  <rect x="0" y="0" width="120" height="80" fill="#171a20"/>
  <defs>
    <filter id="proj" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="b"/>
      <feOffset in="b" dx="8" dy="8" result="off"/>
      <feFlood flood-color="#000000" result="f"/>
      <feComposite in="f" in2="off" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="30" y="20" width="50" height="40" fill="#3ccf7a" filter="url(#proj)"/>
</svg>
