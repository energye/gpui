<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 60" width="120" height="60">
  <!-- defs/symbol/use: symbol viewport + pAR on instantiation, nested use, plain use -->
  <defs>
    <rect id="chip" x="0" y="0" width="10" height="10" fill="#123456"/>
    <symbol id="box" viewBox="0 0 20 10" preserveAspectRatio="xMinYMin meet">
      <rect x="0" y="0" width="20" height="10" fill="#aa0000"/>
      <use href="#chip" x="5" y="2"/>
    </symbol>
  </defs>
  <use href="#box" x="10" y="10" width="40" height="20"/>
  <use href="#chip" x="80" y="30"/>
</svg>
