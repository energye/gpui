<svg xmlns="http://www.w3.org/2000/svg" width="100" height="40" viewBox="0 0 100 40">
  <!-- 4x4 tile (TL red / BR blue checker), userSpaceOnUse, tiled across the rect -->
  <defs>
    <pattern id="chk" patternUnits="userSpaceOnUse" x="0" y="0" width="4" height="4">
      <rect x="0" y="0" width="2" height="2" fill="#e24a4a"/>
      <rect x="2" y="0" width="2" height="2" fill="#171a20"/>
      <rect x="0" y="2" width="2" height="2" fill="#171a20"/>
      <rect x="2" y="2" width="2" height="2" fill="#4a90e2"/>
    </pattern>
    <pattern id="shifted" href="#chk" patternTransform="translate(2 0)"/>
  </defs>
  <rect x="0" y="0" width="100" height="40" fill="url(#chk)"/>
  <rect x="0" y="30" width="100" height="10" fill="url(#shifted)"/>
</svg>
