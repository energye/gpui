<svg xmlns="http://www.w3.org/2000/svg" width="100" height="60" viewBox="0 0 100 60">
  <!-- gradientTransform rotate + href-inherited stops -->
  <defs>
    <linearGradient id="base" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="0">
      <stop offset="0" stop-color="#ff0000"/>
      <stop offset="1" stop-color="#0000ff"/>
    </linearGradient>
    <linearGradient id="tilted" href="#base" gradientTransform="rotate(90 50 30)"/>
  </defs>
  <rect x="0" y="0" width="100" height="60" fill="url(#tilted)"/>
</svg>
