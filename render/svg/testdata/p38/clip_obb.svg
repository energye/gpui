<svg xmlns="http://www.w3.org/2000/svg" width="200" height="100" viewBox="0 0 200 100">
  <!-- objectBoundingBox clip units: same fractions on two different rects -->
  <defs>
    <clipPath id="half">
      <rect x="0" y="0" width="0.5" height="1"/>
    </clipPath>
  </defs>
  <rect x="0" y="0" width="80" height="100" fill="#3ccf7a" clip-path="url(#half)"/>
  <rect x="100" y="0" width="80" height="100" fill="#f0c000" clip-path="url(#half)"/>
</svg>
