<svg xmlns="http://www.w3.org/2000/svg" width="100" height="60" viewBox="0 0 100 60">
  <!-- luminance mask: white shows, black hides, gray half -->
  <defs>
    <mask id="lum" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="60">
      <rect x="0"  y="0" width="30" height="60" fill="#ffffff"/>
      <rect x="30" y="0" width="30" height="60" fill="#000000"/>
      <rect x="60" y="0" width="30" height="60" fill="#808080"/>
    </mask>
  </defs>
  <rect x="0" y="0" width="100" height="60" fill="#4a90e2" mask="url(#lum)"/>
</svg>
